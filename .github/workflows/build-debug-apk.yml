name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleBeta

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beBoard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      # rolling "test-build" pre-release, so the APK can be downloaded without logging in (e.g. from the GitHub app)
      # the beta build is optimized like a release, but has its own app ID, so it doesn't conflict with real releases
      - name: Publish test build
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build app/build/outputs/apk/beta/*-beta.apk \
            --prerelease --target "$GITHUB_SHA" --title "Test build" \
            --notes "Latest test build of main ($GITHUB_SHA), optimized like a release. Installs next to the regular app. Updating may require uninstalling the previous test build first."

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
